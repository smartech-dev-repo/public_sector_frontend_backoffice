name: Repository files

# Fails a push or pull request that adds build output, scratch scripts, data dumps or secrets.
# The same rules run locally as a pre-commit hook; this check can't be skipped with --no-verify.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-repo-files.mjs
